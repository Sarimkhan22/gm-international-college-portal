{% extends 'base.html' %}{% block content %}<h2>Expenses</h2><form class="row g-2 mb-3"><div class="col-md-2"><select class="form-select" name="month">{% for i,n in enumerate(months,1) %}<option value="{{i}}" {% if i==m %}selected{% endif %}>{{n}}</option>{% endfor %}</select></div><div class="col-md-2"><input class="form-control" name="year" value="{{y}}"></div><div class="col-md-2"><button class="btn btn-primary">Refresh</button></div></form><div class="card p-3 mb-3"><form method="post" class="row g-2"><input type="hidden" name="month" value="{{m}}"><input type="hidden" name="year" value="{{y}}"><div class="col-md-2"><input class="form-control" type="date" name="expense_date" required></div><div class="col-md-2"><select class="form-select" name="category">{% for x in expense_types %}<option>{{x}}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" name="description" placeholder="Description"></div><div class="col-md-2"><input class="form-control" type="number" step="0.01" name="amount" placeholder="Amount" required></div><div class="col-md-2"><input class="form-control" name="notes" placeholder="Notes"></div><div class="col-md-1"><button class="btn btn-success">Add</button></div></form></div><div class="card p-3"><h5>Total: AED {{'%.2f'|format(total)}}</h5><table class="table"><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr>{% for r in rows %}<tr><td>{{r.expense_date}}</td><td>{{r.category}}</td><td>{{r.description}}</td><td>AED {{'%.2f'|format(r.amount)}}</td><td><form method="post" action="{{url_for('delete_expense',eid=r.id)}}"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
