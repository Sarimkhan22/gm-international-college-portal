{% extends 'base.html' %}{% block content %}<h2>Portal Users</h2><div class="card p-3 mb-3"><form method="post" class="row g-2"><div class="col-md-4"><input class="form-control" name="username" placeholder="Username" required></div><div class="col-md-4"><input class="form-control" name="password" placeholder="Password" required></div><div class="col-md-2"><button class="btn btn-success">Create Staff User</button></div></form></div><div class="card p-3 table-responsive"><table class="table"><tr><th>Username</th><th>Role</th><th>Status</th><th>Reset Password</th><th>Actions</th></tr>{% for r in rows %}<tr><td>{{r.username}}</td><td>{{r.role}}</td><td>{% if r.active %}ACTIVE{% else %}INACTIVE{% endif %}</td><td><form method="post" action="{{url_for('reset_user',uid=r.id)}}" class="d-flex gap-1"><input class="form-control" name="password" placeholder="New password" required><button class="btn btn-sm btn-primary">Reset</button></form></td><td><form class="d-inline" method="post" action="{{url_for('toggle_user',uid=r.id)}}"><button class="btn btn-sm btn-warning">Toggle</button></form> {% if r.role!='Admin' %}<form class="d-inline" method="post" action="{{url_for('delete_user',uid=r.id)}}"><button class="btn btn-sm btn-danger">Delete</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
