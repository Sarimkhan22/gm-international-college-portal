{% extends 'base.html' %}{% block content %}<h2>Staff / Teachers</h2><div class="card p-3 mb-3"><form method="post" action="{{url_for('save_staff')}}" class="row g-2"><div class="col-md-3"><input class="form-control" name="staff_name" placeholder="Staff name" required></div><div class="col-md-2"><input class="form-control" name="designation" placeholder="Designation"></div><div class="col-md-2"><input class="form-control" name="contact" placeholder="Contact"></div><div class="col-md-2"><input class="form-control" type="date" name="visa_expiry"></div><div class="col-md-2"><input class="form-control" type="date" name="insurance_expiry"></div><div class="col-md-12"><input class="form-control" name="notes" placeholder="Notes"></div><div class="col-md-2"><button class="btn btn-success">Add Staff</button></div></form></div><div class="card p-3 table-responsive"><table class="table"><tr><th>Name</th><th>Designation</th><th>Contact</th><th>Visa</th><th>Insurance</th><th></th></tr>{% for r in rows %}<tr><td>{{r.staff_name}}</td><td>{{r.designation}}</td><td>{{r.contact}}</td><td>{{r.visa_expiry}}</td><td>{{r.insurance_expiry}}</td><td><form method="post" action="{{url_for('delete_staff',sid=r.id)}}"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
