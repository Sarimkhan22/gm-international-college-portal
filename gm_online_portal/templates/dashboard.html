{% extends 'base.html' %}{% block content %}<h2>Dashboard</h2><form class="row g-2 mb-3"><div class="col-auto"><select class="form-select" name="month">{% for i,n in enumerate(months,1) %}<option value="{{i}}" {% if i==m %}selected{% endif %}>{{n}}</option>{% endfor %}</select></div><div class="col-auto"><input class="form-control" name="year" value="{{y}}"></div><div class="col-auto"><button class="btn btn-primary">Refresh</button></div></form><div class="row g-3"><div class="col-md-3"><div class="card p-3"><div class="small-muted">Students</div><div class="stat">{{students}}</div></div></div><div class="col-md-3"><div class="card p-3"><div class="small-muted">Fee Collected</div><div class="stat">AED {{'%.2f'|format(collected)}}</div></div></div><div class="col-md-3"><div class="card p-3"><div class="small-muted">Expenses</div><div class="stat">AED {{'%.2f'|format(expenses)}}</div></div></div><div class="col-md-3"><div class="card p-3"><div class="small-muted">Net</div><div class="stat">AED {{'%.2f'|format(net)}}</div></div></div></div>{% endblock %}
