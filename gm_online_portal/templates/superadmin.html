{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2>Super Admin Control Panel</h2><span class="badge bg-dark">{{session.username}}</span></div><div class="card p-4 mb-4"><h5>Create Customer / College Portal</h5><form method="post" action="{{url_for('create_tenant')}}" class="row g-2"><div class="col-md-4"><input class="form-control" name="name" placeholder="College / Customer name" required></div><div class="col-md-3"><input class="form-control" name="username" placeholder="Admin username" required></div><div class="col-md-3"><input class="form-control" name="password" placeholder="Temporary password" required></div><div class="col-md-2"><button class="btn btn-primary w-100">Create</button></div></form></div><div class="card p-3"><h5>Customer Accounts</h5><div class="table-responsive"><table class="table table-striped"><tr><th>Name</th><th>Admin Users</th><th>Status</th><th>Action</th></tr>{% for t in tenants %}<tr><td>{{t.name}}</td><td>{{t.admins}}</td><td>{% if t.active %}<span class="badge bg-success">ACTIVE</span>{% else %}<span class="badge bg-secondary">INACTIVE</span>{% endif %}</td><td><form class="d-inline" method="post" action="{{url_for('toggle_tenant',tenant_id=t.id)}}"><button class="btn btn-sm btn-warning">{% if t.active %}Deactivate{% else %}Activate{% endif %}</button></form> <form class="d-inline" method="post" action="{{url_for('delete_tenant',tenant_id=t.id)}}" onsubmit="return confirm('Delete this customer and all its data?')"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
